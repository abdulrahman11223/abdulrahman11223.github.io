<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Search a city and see temperature, conditions, humidity, wind speed and live weather icons." />
  <title>Weather Lookup</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg"></div>

  <main class="app-shell">
    <section class="weather-card">
      <div class="card-top">
        <div>
          <p class="eyebrow">SkyCast</p>
          <h1>SkyCast — Weather instantly</h1>
          <p>Enter any city and get temperature, conditions, humidity and wind speeds</p>
        </div>
      </div>

      <form id="weather-form" class="search-form">
        <label for="city-input" class="sr-only">City name</label>
        <input
          type="text"
          id="city-input"
          placeholder="e.g. London"
          aria-label="Enter city name"
          required
        />
        <div class="form-actions">
          <button type="submit" class="primary">Search weather</button>
          <button type="button" id="loc-button" class="loc-button">Use my location</button>
        </div>
      </form>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div id="weather-results" class="weather-results hidden" aria-live="polite"></div>

      <p class="notice">Tip: Use "City" or "City, Country" format (e.g., "London, UK").</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
